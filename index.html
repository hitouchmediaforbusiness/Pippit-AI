<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pippit AI — Create Scroll-Stopping Content Faster</title>

<meta name="description"
content="Turn products, ideas and campaigns into polished AI videos, images and marketing content with Pippit AI.">

<style>
:root{
  --bg:#070707;
  --panel:#101010;
  --panel2:#151515;
  --text:#f5f3ee;
  --muted:#a7a39b;
  --line:rgba(255,255,255,.10);
  --lime:#d9ff45;
  --orange:#ff7657;
  --purple:#9a7cff;
  --max:1180px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.5;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  display:block;
  max-width:100%;
}

.container{
  width:min(var(--max),calc(100% - 40px));
  margin:auto;
}

/* NAV */

.nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}

.logo{
  font-weight:900;
  letter-spacing:-.05em;
  font-size:22px;
}

.logo span{
  color:var(--lime);
}

.navlinks{
  display:flex;
  gap:28px;
  color:#bbb;
  font-size:14px;
}

.navcta,
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  font-weight:800;
  transition:.2s;
}

.navcta{
  padding:11px 18px;
  background:#fff;
  color:#090909;
  font-size:13px;
}

.navcta:hover,
.btn:hover{
  transform:translateY(-2px);
}

/* BUTTONS */

.btn{
  padding:16px 23px;
  background:var(--lime);
  color:#090909;
  box-shadow:0 10px 40px rgba(217,255,69,.12);
}

.btn.dark{
  background:#171717;
  color:#fff;
  border:1px solid var(--line);
  box-shadow:none;
}

/* HERO */

.hero{
  padding:78px 0 70px;
  display:grid;
  grid-template-columns:1fr 1.03fr;
  gap:55px;
  align-items:center;
}

.kicker{
  color:var(--lime);
  font-size:12px;
  font-weight:900;
  letter-spacing:.16em;
  text-transform:uppercase;
}

h1{
  font-size:clamp(48px,6.3vw,86px);
  line-height:.94;
  letter-spacing:-.065em;
  margin:18px 0 25px;
  max-width:700px;
}

h1 em{
  font-style:normal;
  color:var(--lime);
}

.hero p{
  font-size:18px;
  color:#b9b5ad;
  max-width:570px;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
}

.micro{
  font-size:12px;
  color:#777;
  margin-top:14px;
}

/* HERO VISUAL */

.heroVisual{
  position:relative;
}

.browser{
  background:#111;
  border:1px solid #2b2b2b;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
  transform:rotate(1deg);
}

.browserbar{
  height:42px;
  border-bottom:1px solid #272727;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 15px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#555;
}

.mock{
  padding:17px;
  background:#0b0b0b;
}

.mocktop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.mocktitle{
  font-weight:800;
  font-size:14px;
}

.pill{
  background:#1e2510;
  color:var(--lime);
  border:1px solid #3b4b18;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
}

.mockgrid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:12px;
}

.videoCard{
  height:330px;
  border-radius:15px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(145deg,#222,#090909);
}

.videoCard img{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.78;
}

.videoOverlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    transparent 35%,
    rgba(0,0,0,.85)
  );
}

.videoText{
  position:absolute;
  left:18px;
  bottom:17px;
  font-weight:900;
  font-size:25px;
  letter-spacing:-.04em;
}

.side{
  display:grid;
  gap:12px;
}

.sideCard{
  border:1px solid #292929;
  border-radius:15px;
  padding:14px;
  background:#131313;
}

.sideImg{
  height:105px;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.sideImg img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.side small{
  color:#888;
}

.side b{
  font-size:12px;
}

.float{
  position:absolute;
  background:#fff;
  color:#111;
  border-radius:15px;
  padding:13px 15px;
  box-shadow:0 20px 50px #000;
  right:-20px;
  bottom:-20px;
  font-size:12px;
  font-weight:800;
}

.float span{
  display:block;
  color:#4f6500;
  font-size:10px;
  margin-top:3px;
}

/* TRUST */

.trust{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:25px 0;
  color:#888;
  font-size:12px;
}

.trustrow{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.trust b{
  color:#ddd;
}

/* SECTION */

.section{
  padding:105px 0;
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
  margin-bottom:42px;
}

.sectionHead h2{
  font-size:clamp(38px,5vw,64px);
  line-height:.95;
  letter-spacing:-.06em;
  margin:12px 0 0;
  max-width:650px;
}

.sectionHead p{
  color:var(--muted);
  max-width:390px;
}

/* STEPS */

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.step{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
}

.stepImg{
  height:220px;
  position:relative;
  overflow:hidden;
}

.stepImg img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:saturate(.9);
}

.stepNum{
  position:absolute;
  left:15px;
  top:15px;
  background:#fff;
  color:#111;
  border-radius:50%;
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  font-weight:900;
}

.stepBody{
  padding:22px;
}

.stepBody h3{
  margin:0 0 8px;
  font-size:22px;
}

.stepBody p{
  margin:0;
  color:#96928b;
  font-size:14px;
}

/* DEMO */

.demo{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:18px;
}

.demoText{
  background:var(--lime);
  color:#0b0b0b;
  border-radius:24px;
  padding:38px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.demoText h2{
  font-size:clamp(38px,4.8vw,65px);
  line-height:.94;
  letter-spacing:-.06em;
  margin:15px 0;
}

.demoText p{
  color:#38400f;
}

.demoVisual{
  border-radius:24px;
  overflow:hidden;
  border:1px solid var(--line);
  min-height:480px;
  position:relative;
  background:#171717;
}
