        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-deep: #121212;
            --text-ivory: #F5EADD;
            --accent-emerald: #004D40;
            --highlight-gold: #C5A065;
            --grey-subtle: #A09B94;
            
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            
            --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --nav-height: 80px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html {
            font-size: 16px;
            scroll-behavior: smooth;
            background-color: var(--bg-deep);
            color: var(--text-ivory);
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            padding-top: var(--nav-height);
        }

        /* --- UTILITIES --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5vw;
        }

        section {
            padding: 15vh 0;
            position: relative;
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 4rem;
            line-height: 1.1;
            font-weight: 400;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s var(--ease-smooth), transform 0.8s var(--ease-smooth);
        }

        p {
            font-weight: 300;
            color: var(--grey-subtle);
            max-width: 600px;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s var(--ease-smooth), transform 0.8s var(--ease-smooth);
            transition-delay: 0.1s;
        }

        /* Reveal animations triggered by JS */
        section.is-revealing h2,
        section.is-revealing p,
        section.is-revealing .reveal-item {
            opacity: 1;
            transform: translateY(0);
        }

        .affiliate-link {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s ease;
        }
        .affiliate-link:hover {
            opacity: 0.8;
        }

        /* --- BUTTONS --- */
        .cta-button {
            display: inline-block;
            padding: 1.2rem 2.5rem;
            background: linear-gradient(135deg, #d4b688 0%, var(--highlight-gold) 100%);
            color: var(--bg-deep);
            font-family: var(--font-body);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: all 0.4s var(--ease-smooth);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.1);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s var(--ease-smooth);
        }

        .cta-button:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .cta-button:hover {
            box-shadow: 0 10px 30px -10px rgba(197, 160, 101, 0.4);
            transform: translateY(-3px);
        }

        /* --- NAVIGATION --- */
        .header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: var(--nav-height);
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }

        .header.scrolled {
            background: rgba(18, 18, 18, 0.95);
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-ivory);
            font-weight: 400;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0; bottom: -5px;
            width: 0; height: 1px;
            background: var(--highlight-gold);
            transition: width 0.3s var(--ease-smooth);
        }

        .nav-links a:hover {
            color: var(--highlight-gold);
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }

        /* Mobile Menu Placeholder (hidden on desktop) */
        .mobile-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .hero {
